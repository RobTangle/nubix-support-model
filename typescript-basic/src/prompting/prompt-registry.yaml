# Catálogo local: este archivo lo lee la aplicación, no se envía al LLM.
# Cada entrada reúne los archivos independientes de una versión del asistente.
# Esta revisión identifica el registro; no selecciona basic-v2.
version: '2'
# Selección inicial de CLI/UI cuando no elegís otra versión explícitamente.
default: basic-v1
# Referencia predeterminada para comparar evals; no cambia el prompt de una request.
baseline: basic-v1
# Las rutas son relativas a este registro y pertenecen a versions/<id>/.
# system: instrucciones de generación (llamada 2, tras permitir la entrada).
# context: manual insertado en {{manual}} de generación y ambas moderaciones.
# safety: input_moderation/output_moderation, reparación y canario de evals.
# examples: demostraciones opcionales añadidas a generación; no son llamadas aparte.
prompts:
  - id: basic-v1
    label: basic-v1 · contexto base
    system: versions/basic-v1/system.yaml
    context: versions/basic-v1/context.yaml
    safety: versions/basic-v1/safety.yaml
  - id: basic-v2
    label: basic-v2 · contexto + cuatro ejemplos
    system: versions/basic-v2/system.yaml
    context: versions/basic-v2/context.yaml
    safety: versions/basic-v2/safety.yaml
    examples: versions/basic-v2/examples.yaml
  - id: basic-v3
    label: basic-v3 · contexto + cuatro ejemplos + seguridad y manual reforzado
    system: versions/basic-v3/system.yaml
    context: versions/basic-v3/context.yaml
    safety: versions/basic-v3/safety.yaml
    examples: versions/basic-v3/examples.yaml
  - id: basic-v4
    label: basic-v4 · política de phishing y exposición de credenciales
    system: versions/basic-v4/system.yaml
    context: versions/basic-v4/context.yaml
    safety: versions/basic-v4/safety.yaml
    examples: versions/basic-v4/examples.yaml
